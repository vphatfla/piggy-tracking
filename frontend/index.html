<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tells the browser the page renders in both appearances, so native form
         controls and the scrollbar follow the OS theme rather than assuming light. -->
    <meta name="color-scheme" content="light dark" />
    <!-- A manifest theme_color cannot be media-responsive; these can, so the
         mobile browser chrome tracks the theme live. Values match --p-bg. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <title>Piggy Tracking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
