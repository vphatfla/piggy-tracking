name: Frontend Build and Deploy

# Same shape as oppy-marser's own frontend-deploy.yml (push to main,
# path-filtered, workflow_dispatch, OIDC) — see
# ~/workplace/oppy-marser/.github/workflows/frontend-deploy.yml. The real
# additions here: per-path Cache-Control at upload time and a CloudFront
# invalidation, neither of which their service-worker-less static site
# needs — see the upload steps below.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Empty, not an absolute URL: api.ts's `${VITE_API_URL}${path}`
          # then resolves every request relative to whatever origin served
          # the page — vphatfla.me/api/... automatically, same-origin, no
          # domain hardcoded into the build. See frontend/.env.example.
          VITE_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Two syncs, split by whether a filename changes with its content —
      # not by a list of exceptions. That list is what broke a deploy: it
      # named sw.js/manifest/registerSW.js and quietly left index.html on the
      # immutable side, where CloudFront then held a three-day-old copy of it
      # for the full year the header claimed. `assets/*` and `workbox-*.js`
      # carry a content hash in the filename; every other file in dist/ keeps
      # its name across builds and must revalidate. Adding an unhashed file to
      # the build needs no change here — it lands on the no-cache side by
      # default, which is the safe direction to be wrong in.
      - name: Upload hashed assets (immutable)
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_FRONTEND_BUCKET }}
          # oppy-marser's new S3 origin has no origin_path, so CloudFront
          # forwards the full viewer path (including this prefix) straight
          # to the bucket — objects have to live at this same key prefix,
          # not bucket root, or every request 404s at the origin.
          DEST_PREFIX: app/piggy-tracking
        # No --delete: the old bundles have to outlive this step. Until the
        # invalidation below lands, the edge is still serving the previous
        # index.html, and that HTML points at them. Deleting here is what
        # turned a stale page into a broken one — a shell whose own
        # JavaScript 403s. They are pruned after the switchover instead.
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/${DEST_PREFIX}" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "assets/*" \
            --include "workbox-*.js"

      # index.html above all: it is the file that names the hashed bundles, so
      # a cached copy of it pins the whole app to an old build. sw.js and the
      # manifest for the same reason on the PWA side — a long TTL there means
      # an update never reaches installed clients.
      - name: Upload unhashed files (no-cache)
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_FRONTEND_BUCKET }}
          DEST_PREFIX: app/piggy-tracking
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/${DEST_PREFIX}" \
            --cache-control "no-cache" \
            --exclude "assets/*" \
            --exclude "workbox-*.js"

      # no-cache means "revalidate before reusing", not "never cached" — the
      # edge still holds the old object until something tells it to re-ask.
      # Without this step a deploy reaches S3 and stops there, which is
      # exactly the failure this workflow already shipped once.
      #
      # The wildcard counts as a single path against the 1,000/month free
      # tier, so this is free at any deploy rate this repo will see. Waiting
      # for completion rather than fire-and-forget matches backend-deploy.yml
      # polling its SSM command: the API accepting it is not proof it worked.
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/app/piggy-tracking/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $invalidation_id submitted; waiting…"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$invalidation_id"

      # Only now, with the new index.html live at the edge, is it safe to drop
      # the bundles the old one referenced. Same filters as the first sync, so
      # nothing is re-uploaded — those objects were written minutes ago and
      # `sync` compares size and mtime.
      - name: Prune superseded assets
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_FRONTEND_BUCKET }}
          DEST_PREFIX: app/piggy-tracking
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/${DEST_PREFIX}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "assets/*" \
            --include "workbox-*.js"
